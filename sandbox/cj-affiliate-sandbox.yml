- api: cj-affiliate-publisher-tracking-api
  sandbox: false
  note: >-
    CJ warns publishers to contact their CJ representative before implementing
    "to avoid unintentional reporting implications while testing" — an explicit
    statement that there is nowhere safe to test this API.
semantics:
  validation: >-
    Test Mode applies the SAME validation as production. Requests are also run
    through real order processing.
  isolation: >-
    Results are not posted into production reporting and do not affect real
    affiliate program data.
  divergence: >-
    Test Mode does NOT validate whether an order is locked or closed, or whether
    it uses open-ended locking. CJ states plainly that "it is possible for
    something to process correctly in Test Mode but err out in production based
    on the order status." A green Test Mode run is therefore not proof the same
    call succeeds live.
  results_access: >-
    Test Mode output is not self-serve. CJ states "a CJ team member can provide
    you with the results of your testing" — the caller cannot read back what
    happened to a test submission through any API.
test_data:
  test_cards: none published
  test_accounts: none published
  fixtures: none published
  time_simulation: none published
  note: >-
    CJ publishes no test card numbers, seeded test accounts, fixture generators
    or clock-manipulation tooling. Test Mode is run against your own real
    account identifiers (enterpriseId, actionTrackerId, orderId).
gaps:
- No sandbox for any read API, so a publisher cannot develop against Commission Detail or Product Search without live credentials and live data.
- No self-serve way to inspect Test Mode results; a human at CJ is in the loop.
- Test Mode skips order-status validation, so it cannot catch the most common production failure class.
