description: >-
  CJ publishes exactly one sandbox, and it is a separate ENDPOINT rather than a
  test key, a test mode flag or a distinct environment. The Tracking API's Test
  Mode lives at https://tracking.api.cj.com/graphqltest, alongside the
  production endpoint at https://tracking.api.cj.com/graphql. The same personal
  access token authenticates both — there is no test-vs-live key prefix anywhere
  on the CJ platform. No other CJ API (Commission Detail, Product Search / ads,
  Link Search, Advertiser Lookup, Publisher Lookup, Click Events, Publisher
  Tracking) has any sandbox at all.
mode_selection:
  mechanism: distinct endpoint path
  test: https://tracking.api.cj.com/graphqltest
  live: https://tracking.api.cj.com/graphql
  key_prefixes: none
  note: >-
    Because mode is selected by URL rather than by credential, a
    misconfigured base URL writes to production. There is no key-shaped guard
    rail — the same token works in both places.
surfaces:
- api: cj-affiliate-tracking-api
  sandbox: true
  endpoint: https://tracking.api.cj.com/graphqltest
  probe: 'POST introspection -> HTTP 200, schema identical to production, 2026-08-13'
- api: cj-affiliate-commission-detail-api
