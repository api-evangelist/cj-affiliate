description: >-
  CJ Affiliate ships NO Model Context Protocol server. Searches on 2026-08-13
  found no CJ-published remote MCP endpoint, no npm or PyPI package under a CJ or
  Conversant namespace, no mention of MCP anywhere in CJ's documentation corpus
  (https://production-docs-assets.p.cjpowered.com/index.yaml and every page it
  indexes), and no /.well-known/ discovery document on any CJ host. The tool list
  below is a CANDIDATE derived from CJ's real, live GraphQL schemas and its
  documented REST operations — it is what a CJ MCP server would expose, not
  something that exists.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
  note: >-
    `auth: api-key` describes what such a server would need — a CJ Personal
    Access Token as a Bearer credential — not an observed configuration. Note
    that CJ token provisioning is a human step in the developer portal with no
    programmatic issuance, so even a hypothetical remote CJ MCP server could not
    onboard an agent unattended.
