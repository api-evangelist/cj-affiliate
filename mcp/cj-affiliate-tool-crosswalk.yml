description: >-
  Binding between CJ's candidate MCP tool surface, its GraphQL fields and its
  REST operations. CJ's two API generations barely overlap: the GraphQL surface
  is where products, commissions and order writes live, and the REST surface is
  where link, advertiser and publisher DISCOVERY lives. Only ONE capability
  exists in both generations — commission retrieval — and CJ has deprecated the
  REST half of it. Everything else is available in exactly one place, which means
  a client cannot choose a transport; the capability chooses it for them.
