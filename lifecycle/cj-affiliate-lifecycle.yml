generated: '2026-08-13'
method: searched
source: >-
  CJ's documentation corpus at https://production-docs-assets.p.cjpowered.com/,
  live GraphQL introspection of commissions.api.cj.com, ads.api.cj.com and
  tracking.api.cj.com, and live DNS/HTTP probes of every documented API host,
  all on 2026-08-13.
provider: CJ Affiliate
providerId: cj-affiliate
description: >-
  CJ Affiliate is mid-migration from a classic XML REST platform to GraphQL, and
  the lifecycle evidence is unusually blunt about it. CJ's own REST overview
  carries a deprecation banner telling integrators the Commission Detail REST API
  "has been deprecated and will be removed on June 1, 2019" — a removal date now
  more than seven years in the past, on an endpoint that still answers. The
  platform ships no versioning policy page, no deprecation policy, no Sunset or
  Deprecation headers, no changelog and no working status page.
versioning:
  policy_published: false
  policy_url: null
  scheme: path-segment on REST (/v2/, /v3/); unversioned on GraphQL
  graphql_evolution: >-
    Additive schema change plus field-level `@deprecated` markers. Live
    introspection on 2026-08-13 found no deprecated fields on the commissions or
    tracking schemas; the ads schema carries deprecations noted below.
deprecation:
  policy_published: false
  policy_url: null
  headers:
    deprecation: false
    sunset: false
    rfc8594: false
  signal: >-
    Prose banners in the documentation (`deprecation-reason-box`) and GraphQL
    `@deprecated` directives. Nothing machine-readable is served at runtime — a
    client calling a deprecated CJ endpoint receives no header telling it so.
  note: >-
    The stated sunset date on the REST Commission Detail API has been in the past
    since 2019 and the endpoint remains live, which makes CJ's published dates
    unreliable as a planning input. Treat the banner as "will go away, date
    unknown" rather than as a schedule.
