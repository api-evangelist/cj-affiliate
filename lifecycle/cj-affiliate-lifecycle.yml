  replacement: 'GraphQL Commission Detail API, POST https://commissions.api.cj.com/query'
  source: https://production-docs-assets.p.cjpowered.com/REST%20APIs/Commission%20Detail%20(Legacy).md
- id: click-events-advertiserCompanyId
  name: 'Click Events API field `advertiserCompanyId`'
  status: deprecated
