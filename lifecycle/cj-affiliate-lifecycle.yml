  source: https://production-docs-assets.p.cjpowered.com/Publisher%20Site%20Tracking/Click%20Events%20API.md
retired_surfaces:
- id: product-search-rest-legacy
  name: Product Search API (Legacy, REST)
  endpoint: https://product-search.api.cj.com/v2/product-search
  status: retired
  evidence:
  - 'DNS: product-search.api.cj.com does not resolve (NXDOMAIN) as of 2026-08-13, while every other documented *.api.cj.com host resolves to webservices.prod.cj.com or a CJ-owned CDN.'
  - 'Docs: the API is absent from CJ''s current documentation index (https://production-docs-assets.p.cjpowered.com/index.yaml), which lists Overview, Advertiser Lookup, Automated Offer Feed, Commission Detail (Legacy), Link Search, Publisher Lookup and Enumerations under "REST APIs".'
  replacement: >-
    The GraphQL ads API at https://ads.api.cj.com/query — `products`,
    `shoppingProducts`, `travelExperienceProducts`, `financeProducts`,
    `financeCreditCardProducts`, `shoppingProductFeeds`, `productFeeds`.
  action_taken: >-
    openapi/cj-affiliate-product-search-legacy-api-openapi.yml was REMOVED from
    this repo on 2026-08-13. It described a host that no longer exists and its
    parameters had been modelled rather than read from CJ documentation.
sla:
  published: false
  url: null
  note: No developer-facing SLA or uptime commitment is published on developers.cj.com or cj.com.
status_page:
  published: false
  url: https://cj.statuspage.io/
  probe: 'GET https://cj.statuspage.io/ -> HTTP 200 with title "Cj Status - Page Inactive"; the Statuspage API v2 returns "Your page is inactive."'
  note: >-
    A Statuspage tenant exists at cj.statuspage.io but has been DEACTIVATED, so
    there is no operational status surface for CJ APIs. No StatusPage pointer is
    emitted in apis.yml — an inactive page is not a status page.
changelog:
  published: false
  url: null
  note: >-
    CJ publishes no dated API changelog. https://developers.cj.com/changelog
    returns HTTP 200 only because the developer portal is a React SPA that
    answers every path with the same shell; there is no changelog entry in the
    portal's own documentation index. Product and network news is posted
    editorially at https://junction.cj.com/ without version numbers or dates
    tied to API changes.
