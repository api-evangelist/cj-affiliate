  support_url: https://www.cj.com/support
migration_guidance:
  from: Classic XML REST APIs on *.api.cj.com
  to: GraphQL on commissions.api.cj.com, ads.api.cj.com and tracking.api.cj.com
  published_guidance: >-
    Partial. CJ's REST Overview points Commission Detail users at the GraphQL
    Commission Detail API and its Link Search page points product-link users at
    "the Product Search API", but no migration guide, mapping table or
    deprecation timetable is published for the move.
