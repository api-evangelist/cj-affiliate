meters:
- name: publisher_commissions
  description: Commission earned by a publisher on tracked sales / leads, from the Commission Detail API.
  unit: currency
  aggregation: sum
  dimensions:
  - publisher
  - advertiser
  - actionStatus
- name: advertiser_commissions
  description: Commission owed by an advertiser on tracked performance, from the Commission Detail API.
  unit: currency
  aggregation: sum
  dimensions:
  - advertiser
  - publisher
  - actionStatus
- name: sale_amount
  description: Gross sale amount underlying tracked actions.
  unit: currency
  aggregation: sum
  dimensions:
  - advertiser
  - publisher
- name: corrections
  description: Adjustments (returns, cancellations, corrections) reducing recognized commission.
  unit: currency
  aggregation: sum
  dimensions:
  - advertiser
  - correctionReason
principles:
- name: Visibility
  description: Pull Commission Detail (publisherCommissions / advertiserCommissions) on a schedule to see near-real-time earnings and spend before they post in the interface.
- name: Allocation
  description: Attribute commissions by advertiser, publisher / website, and action tracker to map revenue and cost to campaigns and cost centers.
- name: Optimization
  description: Track action status transitions (new to locked to closed) and corrections to forecast realizable commission and focus on high-yield programs.
- name: Accountability
  description: Reconcile Commission Detail records against the CJ interface monthly and assign owners per program / property.
