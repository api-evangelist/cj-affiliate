description: >-
  FinOps view of CJ Affiliate. CJ is an affiliate marketing network rather than
  a usage-metered API vendor, so there is no per-call API invoice to manage. The
  relevant financial flows are commission economics: publishers earn commissions
  (revenue) on the sales and leads they drive, and advertisers pay CJ network
  fees plus performance commissions (cost). The developer APIs are the
  instrumentation for that economy - the Commission Detail API is the primary
  source of near-real-time commission / transaction data used to reconcile
  earnings and spend. "FinOps" here means treating the Commission Detail data as
  the ledger you reconcile against, not managing a metered API bill.
notes: >-
  There is no reconciled per-request API price. Cost / revenue attribution comes
  from commission records (advertiser, publisher, action status, amounts), not
  from an API usage meter. Verify commission terms per program in the CJ
  interface.
