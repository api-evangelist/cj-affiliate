  description: GraphQL API for product discovery, product feeds and catalog management across advertiser
    feeds. Ten queries cover common products, retail shoppingProducts (including GTIN and Google product
    category lookup), travelExperienceProducts, financeProducts and financeCreditCardProducts with full
    credit-card term sheets, and shoppingProductFeeds / productFeeds which list every advertiser feed
    in the network for cold discovery regardless of join status. Five mutations create, update and delete
    shopping and credit-card products, and five subscriptions stream an advertiser's entire feed. Single
    endpoint POST https://ads.api.cj.com/query with a Bearer personal access token.
