aid: cj-affiliate
url: https://raw.githubusercontent.com/api-evangelist/cj-affiliate/refs/heads/main/apis.yml
name: CJ Affiliate
kind: company
description: CJ Affiliate (formerly Commission Junction) is one of the largest affiliate
  marketing networks, connecting publishers with thousands of advertiser programs.
  Its developer platform is primarily a modern GraphQL API - the Commission Detail
  API at commissions.api.cj.com and the Product Search / ads GraphQL API at
  ads.api.cj.com - covering commission and transaction data, product feeds, and
  advertiser discovery. A set of legacy REST APIs (Link Search, Advertiser Lookup,
  Publisher Lookup, and the legacy Product Search) remains documented for finding
  links, advertisers, publishers, and products. All APIs authenticate with a
  personal access token (Bearer) created in the CJ developer portal.
