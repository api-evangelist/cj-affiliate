  description: GraphQL API serving near-real-time commission and transaction data. The publisherCommissions
    and advertiserCommissions queries return commission records filtered by posting, event or locking
    date range, action status, action type, advertiser or publisher ids, ad ids and website ids, with
    monetary amounts, line-item detail, situational commissioning detail and correction reasons. Responses
    carry count, maxCommissionId and payloadComplete, supporting an incremental sinceCommissionId watermark
    rather than page cursors. Read-only - the schema declares no mutations. Single endpoint POST https://commissions.api.cj.com/query
    with a Bearer personal access token.
