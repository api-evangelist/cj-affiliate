- aid: cj-affiliate:cj-affiliate-tracking-api
  name: CJ Affiliate Advertiser Tracking API
  tags:
  - Tracking
  - Orders
  - Transactions
  - GraphQL
  - Conversion
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cj.com/docs/advertiser-api-tracking/api-overview
  baseURL: https://tracking.api.cj.com/graphql
  description: 'GraphQL API through which advertisers submit the full transaction lifecycle - createOrders
    for new orders, restateOrders for changes and additions, cancelOrders for full corrections. CJ takes
    a deterministic approach: an order is uniquely keyed on Order ID + Action ID + Enterprise ID, and
    a restatement completely overwrites the order with the state supplied. Carries typed vertical parameters
    for Retail, Finance, Travel and Network Services plus arbitrary custom parameters. A Test Mode endpoint
    at https://tracking.api.cj.com/graphqltest applies the same validation without posting to production
    reporting. Advertisers only; batch at most 10,000 orders per request.'
  properties:
  - type: Documentation
    url: https://developers.cj.com/docs/advertiser-api-tracking/api-overview
  - type: APIReference
    url: https://developers.cj.com/docs/advertiser-api-tracking/api-overview
  - type: GraphQL
