- aid: cj-affiliate:cj-affiliate-click-events-api
  name: CJ Affiliate Click Events API
  tags:
  - Click Tracking
  - Attribution
  - Privacy
  - Partners
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cj.com/docs/publisher-site-tracking/click-events-api
  baseURL: https://clicks.api.cj.com
  description: Server-to-server JSON REST API through which CJ partners register a consumer click and
    receive back the final landing-page URL carrying the cjevent tracking parameter. Supports bounceless
    tracking experiences and first-party id journey mapping. Cannot be called from a browser, rejects
    unknown fields, and rejects any field containing an email pattern as consumer PII. On any error the
    partner must fall back to a traditional CJ tracking click URL.
  properties:
  - type: OpenAPI
    url: openapi/cj-affiliate-click-events-api-openapi.yml
  - type: Overlay
    url: overlays/cj-affiliate-click-events-api-overlay.yaml
  - type: Documentation
    url: https://developers.cj.com/docs/publisher-site-tracking/click-events-api
  - type: APIReference
    url: https://developers.cj.com/docs/publisher-site-tracking/click-events-api
- aid: cj-affiliate:cj-affiliate-publisher-tracking-api
  name: CJ Affiliate Publisher Tracking API
  tags:
  - Click Tracking
  - Attribution
  - Privacy
  - Publisher
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cj.com/docs/publisher-site-tracking/publisher-tracking-api
  baseURL: https://publishertracking.api.cj.com
  description: Server-to-server JSON REST API through which publishers exchange a standard CJ tracking
    link for a final destination URL, taking the consumer straight to the advertiser where a bounceless
    journey is appropriate and returning the original tracking link where it is not. Cannot be called
    from a browser - the browser-based equivalent is CJ's Publisher Tag. On any error the publisher must
    navigate the consumer to the traditional click URL.
  properties:
  - type: OpenAPI
    url: openapi/cj-affiliate-publisher-tracking-api-openapi.yml
  - type: Overlay
    url: overlays/cj-affiliate-publisher-tracking-api-overlay.yaml
  - type: Documentation
    url: https://developers.cj.com/docs/publisher-site-tracking/publisher-tracking-api
  - type: APIReference
    url: https://developers.cj.com/docs/publisher-site-tracking/publisher-tracking-api
- aid: cj-affiliate:cj-affiliate-commission-detail-legacy-api
  name: CJ Affiliate Commission Detail API (Legacy)
  tags:
  - Commissions
  - Transactions
  - Deprecated
  - REST
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cj.com/docs/rest-apis/commission-detail
  baseURL: https://commission-detail.api.cj.com
  description: DEPRECATED XML REST API for near-real-time commission and item-detail data. CJ's own documentation
    states it was to be removed on 1 June 2019 and directs integrators to the GraphQL Commission Detail
    API, but the host still answers with HTTP 401 as of August 2026. Date ranges are capped at 31 days,
    start-date inclusive and end-date exclusive, and the commission-id parameter supports the same incremental
    watermark pattern the GraphQL API exposes as sinceCommissionId. 25 calls per minute.
  properties:
  - type: OpenAPI
    url: openapi/cj-affiliate-commission-detail-legacy-api-openapi.yml
  - type: Overlay
    url: overlays/cj-affiliate-commission-detail-legacy-api-overlay.yaml
