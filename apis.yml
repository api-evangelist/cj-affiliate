    type: APIReference
  - url: graphql/cj-affiliate-schema.graphql
    type: GraphQL
  - url: graphql/cj-affiliate-graphql.md
    type: GraphQL
  - url: collections/cj-affiliate.postman_collection.json
    type: PostmanCollection
  - url: collections/cj-affiliate.opencollection.json
    type: OpenCollection
  description: >-
    Modern GraphQL API serving near-real-time commission and transaction data. The publisherCommissions
    and advertiserCommissions queries return commission records filtered by posting date range, action
    status, advertiser or publisher IDs, order and shopper IDs, with monetary amounts and line-item detail.
    Single endpoint POST https://commissions.api.cj.com/query with a Bearer personal access token.
- aid: cj-affiliate:cj-affiliate-product-search-api
  name: CJ Product Search API
  tags:
  - Products
  - Product Feed
  - GraphQL
  - Shopping
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cj.com/graphql/reference/Product%20Search
  baseURL: https://ads.api.cj.com/query
  properties:
  - url: https://developers.cj.com/graphql/reference/Product%20Search
    type: Documentation
  - url: https://developers.cj.com/graphql/reference/Product%20Search
    type: APIReference
  - url: graphql/cj-affiliate-schema.graphql
    type: GraphQL
  - url: graphql/cj-affiliate-graphql.md
    type: GraphQL
  description: >-
    Modern GraphQL API for product discovery across advertiser product feeds. The products and shoppingProducts
    queries search products you can promote by keyword, price range, currency, country / serviceable area,
    UPC, and advertiser, while shoppingProductFeeds lists every advertiser feed in the network for cold
    discovery regardless of join status. Single endpoint POST https://ads.api.cj.com/query with a Bearer
    personal access token.
