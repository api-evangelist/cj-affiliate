aid: cj-affiliate
url: https://raw.githubusercontent.com/api-evangelist/cj-affiliate/refs/heads/main/apis.yml
name: CJ Affiliate
kind: company
description: CJ Affiliate (formerly Commission Junction) is one of the largest affiliate marketing networks,
  connecting publishers with thousands of advertiser programs. Its current developer platform is three
  GraphQL APIs - Commission Detail at commissions.api.cj.com for near-real-time commission and transaction
  data, Product Search / Ads at ads.api.cj.com for product discovery, product feeds and catalog writes,
  and Advertiser Tracking at tracking.api.cj.com for submitting, restating and cancelling orders. Alongside
  them CJ still documents a family of classic XML REST APIs - Link Search, Advertiser Lookup, Publisher
  Lookup, the Automated Offer Feed and a deprecated Commission Detail - plus two JSON click-tracking APIs,
  the Click Events API and the Publisher Tracking API. Everything authenticates with a single long-lived
  personal access token minted by hand in the CJ developer portal; there is no OAuth, no scopes and no
  programmatic token issuance. GraphQL introspection is open and unauthenticated on all three endpoints.
