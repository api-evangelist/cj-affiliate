description: >-
  CJ Affiliate publishes an explicit numeric call ceiling on every one of its
  classic REST APIs: 25 calls per minute. The figure appears in a "## Limits"
  block at the top of each API's reference page, alongside a call restriction
  naming which side of the network may call it (publishers only, or advertisers
  only). The GraphQL Tracking API is limited by BATCH SIZE rather than call
  rate — CJ asks advertisers to cap submissions at 10,000 orders per request and
  documents an HTTP 504 as the signal that a batch was too large. Result-set
  size is governed separately by pagination parameters.
notes: >-
  CJ documents the ceilings but NOT the runtime signal. No page in CJ's
  documentation corpus names a rate-limit response header (X-RateLimit-*,
  RateLimit-*, Retry-After) or a 429 status code, and CJ's own published REST
  error tables list only 400 and 401. An agent therefore cannot discover its
  remaining budget from a CJ response — it has to count calls client-side
  against the documented 25/minute and back off blind. That is the single
  largest runtime-semantics gap in this provider's surface.
limit_count: 6
responseHeaders: []
responseHeaders_note: >-
  None published. CJ documents no rate-limit response headers on any API.
exhaustionStatus: not published
limits:
- name: Link Search API
  api: cj-affiliate-link-search-api
  scope: per-account
  window: 1 minute
  limit: 25
  unit: calls
  restriction: Publishers only
  source: https://production-docs-assets.p.cjpowered.com/REST%20APIs/Link%20Search.md
- name: Advertiser Lookup API
  api: cj-affiliate-advertiser-lookup-api
  scope: per-account
  window: 1 minute
  limit: 25
  unit: calls
  restriction: Publishers only
  source: https://production-docs-assets.p.cjpowered.com/REST%20APIs/Advertiser%20Lookup.md
- name: Publisher Lookup API
  api: cj-affiliate-publisher-lookup-api
  scope: per-account
  window: 1 minute
  limit: 25
  unit: calls
  restriction: Advertisers only
  source: https://production-docs-assets.p.cjpowered.com/REST%20APIs/Publisher%20Lookup.md
- name: Automated Offer Feed (via Link Search)
  api: cj-affiliate-link-search-api
  scope: per-account
  window: 1 minute
  limit: 25
  unit: calls
  restriction: Publishers only
  source: https://production-docs-assets.p.cjpowered.com/REST%20APIs/Automated%20Offer%20Feed.md
- name: Commission Detail API (Legacy, deprecated)
  api: cj-affiliate-commission-detail-legacy-api
  scope: per-account
  window: 1 minute
  limit: 25
  unit: calls
  restriction: Advertisers and publishers
  source: https://production-docs-assets.p.cjpowered.com/REST%20APIs/Commission%20Detail%20(Legacy).md
- name: Tracking API batch size
  api: cj-affiliate-tracking-api
  scope: per-request
  window: per request
  limit: 10000
  unit: orders
  restriction: Advertisers only
  exhaustionStatus: 504
  note: >-
    CJ asks advertisers to "limit submissions to a maximum of 10,000 orders at a
    time" on createOrders, restateOrders and cancelOrders. A 504 is documented as
    a generic error that "may be caused by excessive load on the CJ system" with
    the stated remedy of resubmitting 10,000 records or fewer.
  source: https://production-docs-assets.p.cjpowered.com/Advertiser%20API%20Tracking/API%20Overview.md
pagination:
- api: cj-affiliate-advertiser-lookup-api
  params: [page-number, records-per-page]
  default_page_size: 25
  max_page_size: 100
- api: cj-affiliate-link-search-api
  params: [page-number, records-per-page]
  default_page_size: 100
- api: cj-affiliate-commission-detail-api
  style: offset/limit on the GraphQL product queries; `payloadComplete` on commission responses
  note: >-
    The GraphQL Commission Detail queries return a `payloadComplete` boolean
    telling the caller whether the response holds every matching record; the ads
    GraphQL queries take `offset` and `limit`, and `products` additionally takes
    a `page` cursor and a `disableTotalCount` flag.
dateRangeLimits:
- api: cj-affiliate-commission-detail-legacy-api
  window: 1 day minimum, 31 days maximum
  note: start-date is inclusive, end-date is exclusive.
sources:
- https://developers.cj.com/
- https://production-docs-assets.p.cjpowered.com/index.yaml
