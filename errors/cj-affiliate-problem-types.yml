formats:
  classic_rest: 'XML <cj-api><error-message> envelope'
  click_apis: 'JSON { destinationUrl, errorMessages[], statusCode }'
  graphql: 'GraphQL errors[] array with vendor message strings'
  problem_json: >-
    RFC 9457 application/problem+json is used by iam.cj.com, the internal
    personal-access-token service, but by none of the public product APIs.
rfc9457: false
description: >-
  CJ publishes an error reference for every API family, but no shared error
  CODE vocabulary — errors are identified by human-readable message strings, and
  the same condition can surface under different statuses on different APIs
  (authorization failure is 403 on the Click Events API and 401 on the Publisher
  Tracking API). CJ documents a fixed processing ORDER for validation, which is
  the most actionable thing in the catalog: authentication, then schema
  validation, then authorization, then field-level validation, stopping at the
  first failing stage.
error_precedence:
- 1. Authentication
- 2. Schema validation
- 3. Authorization
- 4. Additional field-level validation
error_precedence_note: >-
  You will not see schema errors until an authentication error is fixed, and you
  will not see authorization or field-level errors until schema errors are
  fixed. Retry logic must therefore re-read the response after each fix rather
  than assume it has the full error set.
