deferred_errors:
  note: >-
    CJ draws an explicit line between REAL-TIME validation errors (returned on
    the call) and PROCESSING errors (found up to an hour later, when the order
    reaches CJ's processing system). Processing failures are NOT returned to the
    caller at all — the only signal is the absence of the record from Commission
    Detail reporting, and CJ says a team member must be asked for detail. An
    agent integrating the Tracking API cannot close the loop synchronously; it
    must reconcile against commissions.api.cj.com afterwards.
  conditions_checked_at_processing:
  - Duplicate order id, per the advertiser's duplicate-order logic
  - The order exists and is commissionable (restatements and cancellations)
  - The order is not locked or closed
  - The Action ID belongs to the same account as the Enterprise ID
  - A restatement does not make a commissionable order non-commissionable
  - A restatement does not change the publisher earning the commission
  - Orders on an open-ended locking cycle carry the Status field
