description: 'CJ Affiliate is an affiliate marketing network, not a metered API product. The business
  model is affiliate commissions: publishers join advertiser programs and earn a share of the sales or
  leads they drive, and advertisers pay CJ network fees on that performance. The developer APIs (GraphQL
  Commission Detail and Product Search, plus the legacy REST APIs) are provided as a benefit of holding
  a CJ account and are accessed with a free personal access token - there is no separate per-call price
  list for the APIs themselves. Access to specific data (an advertiser''s product feed, commission records)
  is governed by your account type and program relationships, not by an API tier.'
notes: 'There is no public, reconciled per-request price for CJ''s APIs. Publisher membership in the network
  is free to join; advertiser-side network fees and commission terms are negotiated per program and are
  out of scope for an API price list. Rate limits, not dollar prices, are the primary constraint on API
  usage - see rate-limits/cj-affiliate-rate-limits.yml.

  Re-checked 2026-08-13: https://www.cj.com/pricing returns HTTP 404 - CJ publishes no pricing page at
  all. There is no API price list, no tiers and no metered plan; API access is a free entitlement of holding
  a CJ account, constrained by the documented 25 calls-per-minute rate limit rather than by dollars. Advertiser
  network fees and commission terms are negotiated per program and are not published.'
