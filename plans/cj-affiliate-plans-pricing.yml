plans:
- id: cj-publisher
  name: Publisher (Affiliate)
  type: free
  description: Free to join the network as a publisher. Once approved and joined to advertiser programs,
    you can create a personal access token and call the Commission Detail, Product Search, Link Search,
    and Advertiser Lookup APIs for the advertisers you work with. Revenue comes from commissions on the
    sales / leads you drive, not from the API.
  entries:
  - label: API Access
    name: publisher_api_access
    type: flat
    metric: access
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: free with a CJ publisher account (commission-based network)
    userMultiplied: false
  elements:
  - name: Commission Detail API (GraphQL)
  - name: Product Search API (GraphQL)
  - name: Link Search API (REST)
  - name: Advertiser Lookup API (REST)
  - name: Personal Access Token
- id: cj-advertiser
  name: Advertiser
  type: enterprise
  description: Advertisers run programs on CJ and pay network fees plus commissions on performance. Advertiser
    accounts can call the Commission Detail (advertiserCommissions), Publisher Lookup, and product-import
    / ads GraphQL APIs with a personal access token. Network fees and commission structures are negotiated
    per program.
  entries:
  - label: Program and API Access
    name: advertiser_program_access
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: negotiated network fees + performance commissions (contact CJ)
    userMultiplied: false
  elements:
  - name: Commission Detail API (GraphQL)
  - name: Publisher Lookup API (REST)
  - name: Product Import / Ads API (GraphQL)
  - name: Performance Reporting
