  via: 'actionTrackerId (advertiser-defined)'
- from: Ad
  to: ProductFeed
  type: has_one
  via: adId
  note: A product feed IS an ad in CJ's id space.
- from: ProductFeed
  to: Product
  type: has_many
  via: adId
- from: Product
