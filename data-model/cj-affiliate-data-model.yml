- from: Product
  to: Tax
  type: has_many
  via: tax
- from: Product
  to: LinkCode
  type: has_one
  via: linkCode
  note: The placeable HTML for the product, mirroring link-code-html on Link Search.
- from: Commission
  to: Company
  type: belongs_to
  via: 'advertiserId + publisherId'
- from: Commission
  to: PromotionalProperty
  type: belongs_to
  via: websiteId
- from: Commission
  to: Ad
  type: belongs_to
  via: aid
- from: Commission
  to: ActionTracker
  type: belongs_to
  via: actionTrackerId
- from: Commission
  to: Item
  type: has_many
  via: items
- from: Commission
  to: Situation
  type: has_many
  via: situationDetails
- from: Commission
  to: Commission
  type: belongs_to
  via: originalActionId
  note: Self-reference linking a correction record to its original transaction.
- from: Item
  to: Situation
  type: has_many
  via: situationDetails
- from: Order
  to: Commission
  type: has_many
  via: 'orderId (asynchronous - the Tracking API write becomes Commission Detail records after processing)'
- from: Order
  to: ActionTracker
  type: belongs_to
  via: actionTrackerId
- from: Order
  to: PromotionalProperty
  type: belongs_to
  via: promotionalPropertyId
- from: Order
  to: VerticalParameters
  type: has_one
  via: verticalParameters
- from: Order
  to: OrderItem
  type: has_many
  via: items
  note: Capped at 100 items per order.
lifecycle_states:
  actionStatus: [NEW, LOCKED, CLOSED, EXTENDED]
  validationStatus: [PENDING, ACCEPTED, DECLINED, AUTOMATED]
  lockingMethod: [IMMEDIATE, FIXED_DATE, OPEN_ENDED, FIXED_DURATION]
  orderStatus: [Pending, Accepted]
  orderCancellationStatus: [Declined]
  correctionReason:
    commissions: [INVALID_CREDIT_CARD, RETURNED_MERCHANDISE, DUPLICATED_ORDER, CANT_SHIP_OR_SOLD_OUT, UNQUALIFIED_LEAD, QUALIFIED_LEAD, BAD_DEBT, BANKRUPTCY, COMPLIANCE, BOOKING_CANCELED, OTHER_REASON]
    tracking: [BadDebt, Bankruptcy, BookingCanceled, CannotShipSoldOut, Compliance, DuplicateOrder, InvalidCreditCard, Other, ReturnedMerchandise, UnqualifiedLead]
  note: >-
    The correction-reason vocabularies on the write side (Tracking, PascalCase)
    and the read side (Commission Detail, SCREAMING_SNAKE) are the same concepts
    under different spellings, and they are NOT one-to-one — Commission Detail
    additionally carries QUALIFIED_LEAD, which the Tracking API cannot send. Any
    mapping between the two must be explicit.
